services:
  - type: web
    name: ai-portfolio-cv-api
    runtime: python
    plan: free
    rootDir: computer-vision/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        sync: false
